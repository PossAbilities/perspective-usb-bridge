name: Build Mac client
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Node dependencies
        working-directory: windows
        run: npm install
      - name: Run client tests
        working-directory: windows
        run: npm test
      # No Apple Developer ID yet, so the app is ad-hoc signed: it runs on
      # Apple Silicon, but Gatekeeper asks the user to approve it once.
      - name: Build Perspective Camera Bridge disk images
        working-directory: windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack:mac
      - uses: actions/upload-artifact@v4
        with:
          name: PerspectiveCameraBridge-Mac
          path: windows/dist/*.dmg
