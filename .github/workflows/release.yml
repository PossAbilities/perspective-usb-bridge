name: Release Perspective USB Bridge
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: USB/IP protocol conformance harness
        run: gradle -p tools/usbip-harness run --quiet
      - name: Android unit tests
        run: gradle -p android testDebugUnitTest
      - name: Build Android test APK
        run: gradle -p android assembleDebug
      - name: Name Android artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PerspectiveUSBBridge-Android-${GITHUB_REF_NAME}-TEST.apk
      - name: Verify Android artifact
        run: test -s PerspectiveUSBBridge-Android-${GITHUB_REF_NAME}-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: PerspectiveUSBBridge-Android-${{ github.ref_name }}-TEST.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch current WHLK-certified USB/IP runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/fetch-usbip-runtime.ps1
      - name: Install Node dependencies
        working-directory: windows
        run: npm install
      - name: Run Windows client tests
        working-directory: windows
        run: npm test
      - name: Build Perspective USB Bridge installer
        working-directory: windows
        run: npm run pack
      - name: Verify Windows installer exists
        shell: pwsh
        run: |
          $files = Get-ChildItem windows/dist/*Setup*.exe
          if (-not $files) { throw 'Windows installer was not produced.' }
          $files | ForEach-Object { Write-Host $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: windows/dist/*Setup*.exe

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files
      - name: Refuse incomplete releases
        run: |
          test -n "$(find release-files -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$(find release-files -maxdepth 1 -name '*.exe' -print -quit)"
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
