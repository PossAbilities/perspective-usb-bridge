name: Build Android APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: USB/IP protocol conformance harness
        run: gradle -p tools/usbip-harness run --quiet
      - name: Android unit tests
        run: gradle -p android testDebugUnitTest
      - name: Build test APK
        run: gradle -p android assembleDebug
      - name: Name test APK clearly
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PerspectiveUSBBridge-Android-v0.7.0-TEST.apk
      - name: Verify APK exists
        run: test -s PerspectiveUSBBridge-Android-v0.7.0-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PerspectiveUSBBridge-Android-v0.7.0-TEST
          path: PerspectiveUSBBridge-Android-v0.7.0-TEST.apk
